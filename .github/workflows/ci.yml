# PR과 develop·main 반영 때마다 자동 시험을 돌린다.
# - java: Gradle wrapper 검증 후 ./gradlew test (암호 모듈 등)
# - diagnosis: 진단 규칙 자동 시험(tools/diagnosis/run-tests.sh)
# 외부 액션은 태그 대신 커밋 SHA로 고정한다(태그가 바뀌어도 같은 코드가 돈다).
name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  java:
    name: Java 빌드·테스트
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Gradle 프로젝트 확인
        id: gradle
        run: |
          if [ -f gradlew ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; echo "gradlew 없음: Java 시험 건너뜀"; fi

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        if: steps.gradle.outputs.present == 'true'
        with:
          distribution: temurin
          java-version: '21'

      # gradle-wrapper.jar가 공식 배포본과 같은지 확인한 뒤 Gradle 캐시를 설정한다
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        if: steps.gradle.outputs.present == 'true'

      - name: 테스트
        if: steps.gradle.outputs.present == 'true'
        run: ./gradlew test --console=plain

      - name: 테스트 결과 보관
        if: always() && steps.gradle.outputs.present == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: java-test-reports
          path: '**/build/reports/tests/test/'
          if-no-files-found: ignore
          retention-days: 7

  diagnosis:
    name: 진단 규칙 시험
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      # 규칙 결과가 버전에 따라 달라질 수 있어 로컬에서 시험한 버전으로 고정한다
      - name: Semgrep 설치 (1.186.0)
        run: python -m pip install --disable-pip-version-check semgrep==1.186.0

      - name: 진단 규칙 시험
        run: bash tools/diagnosis/run-tests.sh

      # 우리 운영 코드에 양자컴퓨터에 취약한 공개키 암호가 들어오면 실패한다.
      # HYBRID의 RSA처럼 의도한 사용은 코드에 nosemgrep으로 표시해 두어 세지 않는다.
      - name: 우리 코드 진단 (libs, services)
        run: |
          status=0
          for target in libs services; do
            python tools/diagnosis/scan.py "$target" --fail-on vulnerable || status=1
          done
          exit "$status"
