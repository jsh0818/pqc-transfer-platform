# 로컬 개발용 PostgreSQL. 내 컴퓨터(127.0.0.1)에서만 접속된다.
# infra/docker-compose.yml의 postgres는 내부망 전용이라 호스트에서 접근할 수 없어서 따로 둔다.
# 사용법은 services/transfer-api/README.md 참고.
name: pqc-transfer-api-dev

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: pqc
      POSTGRES_USER: pqc_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?README의 1번처럼 POSTGRES_PASSWORD 환경변수를 먼저 설정하세요}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - devpgdata:/var/lib/postgresql/data

volumes:
  devpgdata:
