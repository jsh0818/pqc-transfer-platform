rules:
  # 알고리즘 이름이 코드에 적혀 있지 않고 실행할 때 정해지는 곳
  # (설정 파일, 시스템 속성, 요청의 alg 필드 등)
  # 규칙만으로는 위험한지 판단할 수 없으므로 "사람이 확인할 것"으로 표시한다.
  # 코드 안에서 값이 정해지는 상수·지역 변수("RSA" 등)는 다른 규칙이 판정하므로 여기서 뺀다.
  - id: dynamic-crypto-alg
    patterns:
      - pattern-either:
          - pattern: java.security.KeyPairGenerator.getInstance($ALG, ...)
          - pattern: java.security.KeyFactory.getInstance($ALG, ...)
          - pattern: java.security.Signature.getInstance($ALG, ...)
          - pattern: javax.crypto.Cipher.getInstance($ALG, ...)
          - pattern: javax.crypto.KeyAgreement.getInstance($ALG, ...)
      - pattern-not: $CLS.getInstance("...", ...)
    message: >-
      알고리즘($ALG)이 실행 중에 정해져 규칙으로 판단할 수 없음 - 값의 출처를 확인할 것.
      요청의 alg 값을 그대로 쓰는 경우라면 kid로 등록된 키의 알고리즘을 쓰도록 바꿀 것
    languages: [java]
    severity: WARNING
    metadata:
      category: needs-review
